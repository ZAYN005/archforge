openapi: 3.0.0
info:
  title: Space Fractions API
  version: 1.0.0
  description: 'Generated by ArchForge. x-origin: spec = from the documents, derived
    = added by Spec Lint from the diagrams.'
paths:
  /play:
    get:
      summary: Play the game
      x-origin: spec
      x-requirements:
      - FR-1
      responses:
        '200':
          description: '200 OK {gameId: number, state: ''PLAYING'', score: 0, totalQuestions:
            number, question: {prompt: string, options: string[]}}'
          content:
            application/json:
              schema:
                type: object
                properties:
                  gameId:
                    type: integer
                    description: Game ID
        '404':
          description: NO_QUESTIONS when question bank is empty
  /games/{gameId}/question:
    get:
      summary: Get the current prompt
      x-origin: derived
      x-requirements:
      - FR-1
      responses:
        '200':
          description: '200 OK {prompt: string, options: string[], questionNumber:
            number, totalQuestions: number}'
        '404':
          description: GAME_NOT_FOUND when gameId does not exist
        '409':
          description: GAME_OVER when the game has already ended
      x-derived-from: 'SequenceDiagram1: Game->Question getPrompt()'
      parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: integer
  /games/{gameId}/answers:
    post:
      summary: Submit an answer
      x-origin: derived
      x-requirements:
      - FR-1
      responses:
        '200':
          description: '200 OK {correct: boolean, submittedAnswer: string, correctAnswer:
            string, score: number, totalQuestions: number, state: ''PLAYING''|''GAME_OVER'',
            nextQuestion: {prompt, options}|null, finalFeedback: string|null}'
        '400':
          description: INVALID_ANSWER when answer missing or not a valid fraction/integer
        '404':
          description: GAME_NOT_FOUND when gameId does not exist
        '409':
          description: NOT_PLAYING when game is paused
      x-derived-from: 'SequenceDiagram1: User->Game submit answer'
      parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: integer
  /admin/questions:
    put:
      summary: Replace the question bank
      x-origin: derived
      x-requirements:
      - FR-3
      - ASR-2
      responses:
        '200':
          description: '200 OK {count: number}'
        '400':
          description: INVALID_QUESTIONS when questions invalid
        '401':
          description: ADMIN_TOKEN_MISSING when x-admin-token header missing
        '403':
          description: ADMIN_TOKEN_INVALID when x-admin-token does not match options.adminToken
      x-derived-from: 'SequenceDiagram2: Admin->Question update()'
      security:
      - adminToken: []
    get:
      summary: List questions (needed before updating)
      x-origin: derived
      x-requirements:
      - FR-3
      - ASR-2
      responses:
        '200':
          description: '200 OK {questions: [{id: number, prompt: string, options:
            string[], correctAnswer: string}]}'
        '401':
          description: ADMIN_TOKEN_MISSING when x-admin-token header missing
        '403':
          description: ADMIN_TOKEN_INVALID when x-admin-token does not match options.adminToken
      x-derived-from: use case UpdateQuestions
      security:
      - adminToken: []
  /games/{gameId}/score:
    get:
      summary: View Score
      x-origin: derived
      x-requirements:
      - FR-2
      responses:
        '200':
          description: '200 OK {gameId: number, score: number, totalQuestions: number,
            percent: number, state: ''PLAYING''|''PAUSED''|''GAME_OVER''}'
        '404':
          description: GAME_NOT_FOUND when gameId does not exist
      x-derived-from: use case ViewScore
      parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: integer
  /help:
    get:
      summary: View Help
      x-origin: derived
      x-requirements:
      - FR-4
      responses:
        '200':
          description: '200 OK {title: string, rules: string[], controls: string[]}'
      x-derived-from: use case ViewHelp
  /games/{gameId}/pause:
    post:
      summary: Playing -> Paused
      x-origin: derived
      x-requirements:
      - FR-1
      responses:
        '200':
          description: '200 OK {gameId: number, state: ''PAUSED''}'
        '404':
          description: GAME_NOT_FOUND when gameId does not exist
        '409':
          description: ILLEGAL_TRANSITION when current state is not PLAYING
      x-derived-from: state transition Playing --pause()--> Paused
      parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: integer
  /games/{gameId}/resume:
    post:
      summary: Paused -> Playing
      x-origin: derived
      x-requirements:
      - FR-1
      responses:
        '200':
          description: '200 OK {gameId: number, state: ''PLAYING''}'
        '404':
          description: GAME_NOT_FOUND when gameId does not exist
        '409':
          description: ILLEGAL_TRANSITION when current state is not PAUSED
      x-derived-from: state transition Paused --resume()--> Playing
      parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: integer
  /games/{gameId}/quit:
    post:
      summary: Paused -> GameOver
      x-origin: derived
      x-requirements:
      - FR-1
      responses:
        '200':
          description: '200 OK {gameId: number, state: ''GAME_OVER''}'
        '404':
          description: GAME_NOT_FOUND when gameId does not exist
        '409':
          description: ILLEGAL_TRANSITION when current state is not PAUSED
      x-derived-from: resolved transition Paused --quit()--> GameOver
      parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: integer
components:
  securitySchemes:
    adminToken:
      type: apiKey
      in: header
      name: x-admin-token
